<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Парсер цен</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="theme-toggle-input">

  <div class="page">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Парсер цен</h1>
        </div>
      </div>

      <label class="theme-switch" for="theme-toggle" title="Переключить тему">
        <span class="theme-label theme-label-light">Светлая</span>
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="theme-label theme-label-dark">Тёмная</span>
      </label>
    </header>

    <main class="content">
      <section class="panel controls">
        <label class="coef-field">
          <span>Коэффициент</span>
          <input id="coef" type="text" value="1.15" inputmode="decimal" placeholder="1.00">
        </label>

        <form class="search" id="f">
          <input id="q" type="search" placeholder="Наименование или артикул" aria-label="Поиск">
          <button type="submit" id="btn">Поиск</button></form>
      </section>

      <section class="panel health">
      <div class="health-top">
        <div class="health-title">Статус магазинов · <span id="health-updated"></span></div>
          <button type="button" id="warmup">Обновить сессии</button>
        </div>
       <ul class="health-list" id="health-list"></ul>
      </section>

      <section class="panel results">
        <div class="results-head">
          <h2>Результаты</h2>
          <span class="results-note" id="status">Цена × коэф считается от введённого коэффициента</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-sort="shop">Магазин</th>
                <th>Наименование</th>
                <th data-sort="price">Цена</th>
                <th data-sort="priced">Цена × коэф</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
